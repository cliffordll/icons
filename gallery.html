<style>body{font:14px system-ui;margin:28px;color:#333;background:#f5f6f8}h1{font-size:24px}header{position:sticky;top:0;background:#f5f6f8;padding:12px 0}input,select,button{padding:8px;margin-right:8px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.card{background:white;border:1px solid #ddd;border-radius:6px;text-align:center;padding:15px 6px}.art{height:110px;display:flex;align-items:center;justify-content:center}.card small{display:block;color:#777;margin-top:6px}.dark .art{background:#30343b}a{color:inherit;text-decoration:none}#count{margin:12px 0}</style>
