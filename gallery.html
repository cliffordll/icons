<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon Studio · 图标预览</title>
<link rel="icon" href="favicon.ico?v=4" type="image/x-icon">
<link rel="stylesheet" href="preview/preview.css">
</head>
<body data-bg="white">
<div class="layout">
<aside aria-label="图标分类">
  <header class="sidebar-header">
    <div class="brand"><img class="brand-logo" src="source/logos/logo.png?v=2" alt="" aria-hidden="true"><div><h1>Icon Studio</h1><div class="subtitle">图标预览</div></div></div>
    <div id="live" class="live" role="status">正在连接实时预览…</div>
  </header>
  <div class="nav-title">图标库 / LIBRARY</div><nav id="categories" aria-label="资源类型"></nav>
  <div class="nav-title groups-title">按用途浏览</div><nav id="groups" aria-label="图标分组"></nav>
  <div class="aside-note">原生尺寸用于判断实际效果。<br>浏览器缩放设为 100%。<br>图片颜色与透明度保持原样。</div>
</aside>
<main>
  <div class="controls" aria-label="图标筛选与预览设置">
    <h2 class="toolbar-title" title="点击下方图标加入并排对比"><span id="title">工具图标</span><span id="count" class="counter"></span></h2>
    <label class="control">尺寸<select id="size" aria-label="尺寸"><option value="24">24 px</option><option value="30">30 px</option><option value="36">36 px</option><option value="48">48 px</option><option value="384">原图 · 384 px</option></select></label>
    <label class="control">来源<select id="mode" aria-label="来源"><option value="png">PNG 成品</option><option value="svg">SVG 源文件</option></select></label>
    <label class="control">底色<select id="background" aria-label="底色"><option value="white">白色</option><option value="gray">浅灰</option><option value="dark">深色</option><option value="checker">透明棋盘</option></select></label>
    <label class="control"><input id="guides" type="checkbox">画布与中心线</label>
    <input id="search" class="search" type="search" placeholder="搜索名称、前缀或用途…" aria-label="搜索图标">
    <button id="refresh" class="quiet" type="button">刷新资源</button>
  </div>
  <section id="compare" class="compare" aria-label="选中图标并排对比">
    <div class="section-head"><h3 title="拖动卡片左上角的手柄，或使用前移、后移按钮调整顺序">并排对比 <span id="compare-count" class="counter"></span></h3><div class="section-actions"><label class="control">对比尺寸<select id="compare-size" aria-label="对比尺寸"><option value="24">24 px</option><option value="30">30 px</option><option value="36">36 px</option><option value="48">48 px</option><option value="384">原图 · 384 px</option></select></label><button id="people" type="button">人物组</button><button id="clear" type="button">清空</button><button id="collapse" type="button" aria-expanded="true">收起</button></div></div>
    <div id="comparison-grid" class="comparison-grid"></div>
    <div class="toolbar-examples"><small>工具栏 · 24px</small><div id="toolbar-strips"></div></div>
  </section>
  <p id="mode-hint" class="hint"></p>
  <section id="grid" aria-label="图标列表"></section>
</main>
</div>
